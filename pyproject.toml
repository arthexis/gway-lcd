[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gway-lcd"
version = "0.1.0"
description = "Gway-native control for HD44780-compatible character LCD displays"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Rafael J. Guillén-Osorio" },
]
dependencies = [
  "gway-sigils>=0.4.5,<0.5",
  "smbus2>=0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gway_lcd = ["standby.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
