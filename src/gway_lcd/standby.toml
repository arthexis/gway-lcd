[standby]
rotation = ["identity", "network", "errors", "stats"]
hold = 10

[standby.screens.identity]
hi = "[hostname]"
lo = "[arthexis.node_type] [uptime]"
priority = 100

[standby.screens.network]
hi = "[network.wlan0.ip|:-]"
lo = "[network.eth0.ip|:-]"
priority = 200

[standby.screens.errors]
hi = "E[health.errors] W[health.warnings] U[health.undervoltage] F[health.failed_units]"
lo = "[health.error_source|:-]"
priority = 300

[standby.screens.stats]
hi = "M[system.memory_percent]% D[system.disk_free_percent]% C[system.cpu_percent]% [clock]"
lo = "[arthexis.version] [arthexis.status||:FAIL]"
priority = 400
