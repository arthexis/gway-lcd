[standby]
hold = 10

# The package bundles the default rotation:
# identity -> network -> errors -> stats
#
# Override the rotation here if desired:
# rotation = ["identity", "network", "errors", "stats", "site"]

# Bundled screens are overridden field-by-field by name.
# A screen may declare zero or more GWAY project prerequisites. Eligibility is
# checked immediately before each frame, so installing or removing a project is
# reflected by the running LCD service without a restart.
# [standby.screens.network]
# requires = ["network"]
# hold = 15
# lo = "ETH [network.ip:eth0|:-]"

# Multiple prerequisites are ANDed: all named projects must currently exist.
# [standby.screens.node]
# requires = ["device", "arthexis"]
# hi = "Node"
# lo = "Ready"

# User-defined screens join the same namespace. Omitting `requires` means the
# screen is always eligible.
# [standby.screens.site]
# hi = "Garage"
# lo = "[SITE_MESSAGE|:Ready]"
# hold = 10
# priority = 500
