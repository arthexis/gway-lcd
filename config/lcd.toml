[standby]
hold = 10

[standby.screens.status]
hi = "[hostname]"
lo = "Ready"
hold = 10
priority = 100

[standby.screens.stats]
hold = 10
priority = 300

[standby.screens.clock]
hold = 10
priority = 400

# Add more named screens here. With no explicit --rotation, lower priority
# numbers are displayed first. Use --rotation "*" to include every screen,
# or --rotation "status,network,clock" for an exact manual order.
#
# [standby.screens.network]
# hi = "ETH [eth0_ip]"
# lo = "CSMS [csms_status]"
# hold = 15
# priority = 200
