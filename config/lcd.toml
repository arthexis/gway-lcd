[standby]
hold = 10

# The package bundles the default rotation:
# identity -> network -> errors -> stats
#
# Override the rotation here if desired:
# rotation = ["identity", "network", "errors", "stats", "site"]

# Bundled screens are overridden field-by-field by name.
# [standby.screens.network]
# hold = 15
# lo = "ETH [network.eth0.ip|:-]"

# User-defined screens join the same namespace.
# [standby.screens.site]
# hi = "Garage"
# lo = "[SITE_MESSAGE|:Ready]"
# hold = 10
# priority = 500
